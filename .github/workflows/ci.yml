name: CloudSentinel checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: cloudsentinel_test
          POSTGRES_PASSWORD: test-only-database-password
          POSTGRES_DB: cloudsentinel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U cloudsentinel_test -d cloudsentinel_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CLOUDSENTINEL_TEST_DATABASE_URL: postgresql://cloudsentinel_test:test-only-database-password@127.0.0.1:5432/cloudsentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m black --check backend scripts
      - run: python -m unittest discover -s backend/tests -v
      - run: python scripts/preflight.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm run check && npm run build
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f deploy/production/compose.yaml config --quiet
      - run: docker build --target production -t cloudsentinel:production-check .
      - run: docker compose up -d --build
      - name: Check demo startup
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null; then break; fi
            sleep 2
          done
          python3 scripts/smoke_test.py
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop temporary services
        if: always()
        run: docker compose down
