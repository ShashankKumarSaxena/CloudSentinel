services:
  cloudsentinel:
    build: .
    image: cloudsentinel:0.3.0
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLOUDSENTINEL_PORT:-8000}:8000"
    environment:
      CLOUDSENTINEL_DB: /var/lib/cloudsentinel/cloudsentinel.db
      CLOUDSENTINEL_ALLOWED_HOSTS: 127.0.0.1,localhost
      CLOUDSENTINEL_MONITORING: "1"
      CLOUDSENTINEL_SECURE_COOKIES: "0"
      CLOUDSENTINEL_DOCS: "0"
      CLOUDSENTINEL_SMTP_ENABLED: "0"
    volumes:
      - cloudsentinel-data:/var/lib/cloudsentinel
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=67108864
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 128
    stop_grace_period: 150s

volumes:
  cloudsentinel-data:
